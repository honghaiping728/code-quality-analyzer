<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>智能代码质量分析与修复建议系统</title>
    <meta name="description" content="基于大语言模型的智能代码质量分析与自动修复建议系统控制台">
    <script>
        // 首屏前置：在样式与脚本执行前定好主题，避免亮→暗闪一下。
        // 用户显式选过就以其选择为准，否则跟随系统。
        (function () {
            try {
                var saved = localStorage.getItem('cq-theme');
                var theme = (saved === 'light' || saved === 'dark')
                    ? saved
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                // Element Plus 的暗色变量挂在 .dark 上，两个都要给
                document.documentElement.classList.toggle('dark', theme === 'dark');
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
